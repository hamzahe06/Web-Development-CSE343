<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="card">
        <h1 class="title">Todo App</h1>

        <div class="input-row">
            <input type="text" id="todoInput" placeholder="What needs doing?" />
            <button id="addBtn">Add</button>
        </div>

        <div class="controls-row">
            <span class="tip">Tip: double-click a todo to edit. Press Enter to save.</span>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <ul id="todoList" class="todo-list"></ul>

        <div class="footer-row">
            <span id="itemsLeft">0 items left</span>
            <div class="footer-actions">
                <button id="clearCompletedBtn">Clear completed</button>
                <button id="clearAllBtn">Clear all</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
